

include-file = ~/.config/polybar/themes/colors.ini

[bar/mainbar]
override-redirect = true
wm-restack = i3
;fixed-center = true
width = 90%
height = 35px
radius = 15
offset-x = 5%
offset-y = 10px

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 0pt

padding-left = 2
padding-right = 2

module-margin = 2

separator = "•"
separator-foreground = ${colors.disabled}

font-0 = MesloLGL Nerd Font:size=13;2
font-1 = Source Han Sans JP:weight=bold:size=13;2
font-2 = MesloLGL Nerd Font:style=Bold:size=13;2
font-3 = Noto Color Emoji:scale=10;2

modules-left = i3-workspaces
modules-center = xwindow
modules-right = filesystem pulseaudio memory cpu ethwired ethwireless date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/i3-workspaces]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

pin-workspaces = true

label-mode-padding = 2
label-mode-foreground = #000
label-mode-background = ${colors.primary}

label-focused = %index%
label-focused-background = ${colors.secondary}
label-focused-foreground = #f5f5f5
label-focused-padding = 2
label-focused-font = 2

label-unfocused = %index%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.primary}

label-visible = %index%
label-visible-background = ${colors.background-alt}
label-visible-padding = ${self.label-focused-padding}

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %{T2}%title:0:25:...%
font-0 = Source Han Sans JP:weight=bold:size=13;1
format-foreground = ${colors.foreground}
format-padding = 1
scroll = true
scroll-up = #xwindow.prev
scroll-down = #xwindow.next

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}


[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%

format-muted-prefix = "  "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = "Muted"


[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/ethwired]
type = internal/network
interface-type = wired
interval = 5

format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %local_ip%

format-disconnected = <label-disconnected>
label-disconnected = %{F#707880}  down

[module/ethwireless]
type = internal/network
interface-type = wireless
interval = 5

format-connected = <label-connected>
format-connected-prefix = "  "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %local_ip%

format-disconnected = <label-disconnected>
label-disconnected = %{F#707880}  down


[module/date]
type = internal/date
interval = 1

date = %H:%M

format = <label>
format-background = ${colors.background}
format-padding = 2

label = %{F#A19882}  %{F-} %date%
label-foreground = ${colors.foreground}


[settings]
screenchange-reload = true

; vim:ft=dosini

