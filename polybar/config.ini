
[colors]
background = #556b6052
background-alt = #AA4C566A
foreground = #D8DEE9
primary = #BF616A
secondary = #81A1C1
alert = #BF616A
disabled = #4C566A

[bar/mainbar]
override-redirect = true
wm-restack = i3
fixed-center = true
width = 80%
height = 25pt
radius = 15
offset-x = 10%
offset-y = 10px

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 0pt

padding-left = 2
padding-right = 2

module-margin = 2

separator = "•"
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:size=13;1

modules-left = xworkspaces xwindow
modules-right = filesystem pulseaudio memory cpu eth date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = #f5f5f5
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

format-mounted = <label-mounted>
format-mounted-prefix = "  "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%

format-muted-prefix = "  "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = "Muted"

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/eth]
type = internal/network
interface-type = wired
interval = 5

format-connected = <label-connected>
format-connected-prefix = "  "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %local_ip%

format-disconnected = <label-disconnected>
label-disconnected = %{F#707880}disconnected

[module/date]
type = internal/date
interval = 1

date = %H:%M

format = <label>
format-background = ${colors.background}
format-padding = 2

label = %{F#BF616A} %{F-} %date%
label-foreground = ${colors.foreground}


[settings]
screenchange-reload = true

; vim:ft=dosini
